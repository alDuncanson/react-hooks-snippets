name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  marketplace:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install pinned tooling
        run: sfw npm ci

      - name: Validate snippets and README
        run: node scripts/validate.mjs

      - name: Package vsix
        run: npx @vscode/vsce package

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: react-hooks-snippets-*.vsix

      - name: Attach the Sigstore bundle to the release assets
        run: cp "${{ steps.attest.outputs.bundle-path }}" "$(ls react-hooks-snippets-*.vsix).sigstore.json"

      - name: Publish to VS Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --packagePath react-hooks-snippets-*.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes "# React Hooks Snippets $GITHUB_REF_NAME 🚀" \
            --generate-notes \
            react-hooks-snippets-*.vsix \
            react-hooks-snippets-*.vsix.sigstore.json

  openvsx:
    needs: marketplace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install pinned tooling
        run: sfw npm ci

      - name: Download release vsix
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --pattern '*.vsix'

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish react-hooks-snippets-*.vsix
