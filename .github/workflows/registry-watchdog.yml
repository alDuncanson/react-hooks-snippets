name: Registry Watchdog

on:
  schedule:
    - cron: '47 10 * * *' # daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare registries against package.json and Socket
        id: check
        shell: bash
        continue-on-error: true
        run: node scripts/check-registries.mjs | tee report.md

      - name: Open issue on findings
        if: steps.check.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create registry-watchdog --color B60205 --force \
            --description "Opened automatically by the registry watchdog"
          if [ -z "$(gh issue list --repo "$GITHUB_REPOSITORY" --label registry-watchdog --state open --json number --jq '.[0].number // empty')" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" \
              --title "Registry listing or Socket score changed unexpectedly" \
              --label registry-watchdog \
              --body-file report.md
          else
            echo "Watchdog issue already open — skipping."
          fi
