name: Badges

on:
  schedule:
    - cron: '23 9 * * *'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Render badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/badges.mjs /tmp/badges

      - name: Publish to badges branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges
          git rm -rf --quiet .
          cp /tmp/badges/*.svg .
          git add ./*.svg
          git commit -m "chore: update badges"
          git push --force origin badges
