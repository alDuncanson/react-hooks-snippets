name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate snippets and README
        run: node scripts/validate.mjs

      - name: Check extension can be packaged
        run: npx @vscode/vsce ls
